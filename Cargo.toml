[package]
name = "tide"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "A tree-view sidebar for tmux"
repository = "https://github.com/foxytanuki/tide"
keywords = ["tmux", "tui", "terminal", "session-manager", "sidebar"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
tui-tree-widget = "0.24"
unicode-width = "0.2.2"
anyhow = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
